# 每日构建：自动拉取 DeepSeek Harness **master 最新源码**并编译，产出 nightly 安装包。
#
# ── 为什么单独一个 workflow ─────────────────────────────────────────────────
# nightly 与其它通道有本质区别：stable/beta/dev 装的是 npm 上**已发布**的版本，
# 而 nightly 要跟 master 的最新提交走。官方 npm 上没有 nightly 标签
# （实测 dist-tags 只有 alpha / latest / next），所以只能自己从源码编。
#
# ── nightly 只构建，什么都不发 ──────────────────────────────────────────────
# 产物进 Actions artifact（保留 14 天），由人按需下载试跑。**刻意不做**：
#   · 不发 GitHub Release —— nightly 每天一个包，堆 Release 没意义；
#   · 不打热壳 —— nightly 用户本来就该整包换；
#   · 不生成、不部署 feed —— 没有 feed 就没有「把线上 feed 弄坏」的可能。
# （历史教训：早期版本复用六通道发版脚本 release-v2.ps1，结果它会用默认版本号
#   （10.1.0/7.1.0…）把另外六份 feed 重新生成成空骨架；又要求本机 wrangler 目录
#   而在 CI 上直接 throw；还因为 electron-builder 的 CI 隐式 publish 没有 GH_TOKEN
#   而 exit=1。所以现在 nightly 走独立的 scripts/release-nightly.ps1。）
#
# ── 编译链（scripts/fetch-nightly.mjs 封装，已本机实测跑通）──────────────────
#   clone master（runner 在美国 → 直连 github.com；本地才走镜像）
#   → pnpm install --frozen-lockfile（4.3min，需重试抗超时）
#   → pnpm run build（**要求 git 在 PATH**，构建期要 git rev-parse HEAD）
#   → 组装成外壳期望的运行时树
#
# ── 实测踩到的坑（都已在脚本里处理）────────────────────────────────────────
#   · pnpm deploy 不可用：只带 508 个包（源码树 1393），vendor/ 下的包会丢
#   · Windows 上 build:native-system 是 no-op（官方只在 linux/darwin 编原生件）
#   · 构建目录任一父目录若有 0 字节 package.json，PostCSS 会 JSON.parse('') 崩
#
# ── 触发 ────────────────────────────────────────────────────────────────────
#   1) 定时：每天 UTC 18:00（北京时间次日 02:00）
#   2) 手动：Actions → nightly → Run workflow
name: nightly

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'nightly 外壳版本号（留空 = 自动用 10.4.<运行号>）'
        required: false
        default: ''

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

# ⚠️ runner 在**美国**：把所有上游显式指回官方。
#    仓库里的 .npmrc 指向国内镜像（给本机构建用），而 npm 的优先级是
#    「命令行 > 环境变量 > 项目 .npmrc > user .npmrc」—— 只有环境变量能盖住它。
#    （实测：`npm config set` 写的是 user 级，**盖不住**项目 .npmrc。）
env:
  NPM_CONFIG_REGISTRY: 'https://registry.npmjs.org'
  NPM_CONFIG_ELECTRON_MIRROR: 'https://github.com/electron/electron/releases/download/'
  NPM_CONFIG_ELECTRON_BUILDER_BINARIES_MIRROR: 'https://github.com/electron-userland/electron-builder-binaries/releases/download/'
  NPM_CONFIG_DISTURL: 'https://nodejs.org/dist'

jobs:
  nightly:
    runs-on: windows-latest
    timeout-minutes: 150

    steps:
      - name: 解析版本号
        id: v
        shell: pwsh
        run: |
          $input = '${{ inputs.version }}'
          if ($input) { $ver = $input } else { $ver = '10.4.${{ github.run_number }}' }
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "nightly 外壳版本 = $ver"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # pnpm 版本由仓库的 packageManager 字段决定（11.7.0）
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: 安装外壳依赖
        shell: pwsh
        run: npm ci --no-audit --no-fund

      # ── 核心：从源码构建 nightly 运行时 ────────────────────────────────────
      # 这一步会 clone harness master、装依赖、编译、组装运行时树。
      # 产物落在 resources/dsh-runtime（外壳期望的位置）。
      - name: 构建 nightly 运行时（源码编译）
        shell: pwsh
        run: |
          # ⚠️ runner 在**美国**：所有上游都直连，**不要**用国内镜像 ——
          #    走 npmmirror/gh-proxy 等于「美国 → 中国代理 → 美国」，绕远路且多一个故障点。
          #    脚本内部也会按 CI 环境变量自动选直连（见 fetch-nightly.mjs 的 inCI）。
          # git 由 runner 自带；脚本会自己找（PATH 优先）
          git --version
          node scripts/fetch-nightly.mjs --to resources/dsh-runtime

      - name: 记录上游提交
        id: upstream
        shell: pwsh
        run: |
          $j = Get-Content 'resources/dsh-runtime/package.json' -Raw | ConvertFrom-Json
          $sha = $j.dshNightly.commit
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short=$($sha.Substring(0,7))" >> $env:GITHUB_OUTPUT
          "upstream=$($j.dshNightly.upstreamVersion)" >> $env:GITHUB_OUTPUT
          Write-Host "上游 $($j.dshNightly.upstreamVersion) @ $($sha.Substring(0,7))"

      - name: 生成图标资源
        shell: pwsh
        run: npm run gen:assets

      # ── 构建安装包（唯一的重活）──────────────────────────────────────────────
      - name: 构建 nightly 安装包
        shell: pwsh
        run: |
          # 独立脚本：只构建，不发 Release、不打热壳、不碰 feed。
          # 它会自检运行时树确实是 nightly（package.json 里有 dshNightly 段）。
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/release-nightly.ps1 `
            -Version '${{ steps.v.outputs.version }}'

      # ── 归档 ────────────────────────────────────────────────────────────────
      - name: 归档产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ steps.v.outputs.version }}-${{ steps.upstream.outputs.short }}
          path: |
            dist/DSH-Desktop-Setup-*.exe
            dist/DSH-Desktop-Setup-*.exe.blockmap
          retention-days: 14
          if-no-files-found: warn

      - name: 汇总
        if: always()
        shell: pwsh
        run: |
          Write-Host '=== nightly 构建汇总 ==='
          Write-Host "  外壳版本   = ${{ steps.v.outputs.version }}"
          Write-Host "  上游 dsh   = ${{ steps.upstream.outputs.upstream }}"
          Write-Host "  上游提交   = ${{ steps.upstream.outputs.short }}"
          Write-Host '  产物       = Actions 页面本次 run 的 Artifacts（保留 14 天）'
          Write-Host '  说明       = nightly 只构建验证，不发布 Release、不生成 feed'
