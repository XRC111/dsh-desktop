# 构建六个通道的 Windows 安装包，上传到 GitHub Release，并部署 feed。
#
# ── 为什么用 windows-latest 而不是 ubuntu ────────────────────────────────────
# 产物是 NSIS 安装包 + Win32 原生模块（koffi / node-pty / sharp 的 win32-x64 预编译件），
# 而且 w7 线要下载并**在 exe 上做等长字节替换**打指纹补丁 —— 这些都要求 Windows。
#
# ── 六个通道 ────────────────────────────────────────────────────────────────
#   主线 stable/beta/dev  +  w7 stable/beta/dev
#   w7 用社区 fork Electron（e3kskoy7wqk/Electron-for-windows-7 v44.2.0）
#   + scripts/patch-w7-electron.py 把宿主指纹伪装成官方 44.0.0（否则 dsh 拒绝启动）
#
# ── 必需的仓库 secret ───────────────────────────────────────────────────────
#   CLOUDFLARE_API_TOKEN   部署 feed 用（Cloudflare Pages: dsh-desktop-feed）
#   CLOUDFLARE_ACCOUNT_ID  同上
#   （Release 上传用内置的 GITHUB_TOKEN，不需要额外配置）
#
# ── 触发方式 ────────────────────────────────────────────────────────────────
#   1) 手动：Actions → build-release → Run workflow（可填六个版本号）
#   2) 打 tag：git tag v10.1.4 && git push origin v10.1.4
name: build-release

on:
  workflow_dispatch:
    inputs:
      stable:
        description: '主线 stable 版本号'
        required: true
        default: '10.1.3'
      beta:
        description: '主线 beta 版本号'
        required: true
        default: '10.2.2'
      dev:
        description: '主线 dev 版本号'
        required: true
        default: '10.3.1'
      w7:
        description: 'w7 stable 版本号'
        required: true
        default: '7.1.4'
      w7beta:
        description: 'w7 beta 版本号'
        required: true
        default: '7.2.1'
      w7dev:
        description: 'w7 dev 版本号'
        required: true
        default: '7.3.1'
      deploy_feed:
        description: '是否部署 feed（需要 Cloudflare secrets）'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

# 同时只允许一个构建在跑（六通道构建很重，且都要写同一个 Release）
concurrency:
  group: build-release
  cancel-in-progress: false

permissions:
  contents: write   # 上传 Release 资产

# ⚠️ runner 在**美国**：这里把所有上游**显式指回官方**。
#    仓库里的 .npmrc 指向国内镜像（给本机构建用），而 npm 的优先级是
#    「命令行 > 环境变量 > 项目 .npmrc > user .npmrc」—— 所以只有环境变量能盖住它。
#    （实测：`npm config set` 写的是 user 级，**盖不住**项目 .npmrc。）
env:
  NODE_OPTIONS: ''
  NPM_CONFIG_REGISTRY: 'https://registry.npmjs.org'
  NPM_CONFIG_ELECTRON_MIRROR: 'https://github.com/electron/electron/releases/download/'
  NPM_CONFIG_ELECTRON_BUILDER_BINARIES_MIRROR: 'https://github.com/electron-userland/electron-builder-binaries/releases/download/'
  NPM_CONFIG_DISTURL: 'https://nodejs.org/dist'
  # sharp / node-sqlite3 用预编译 npm 包（@img/*、prebuild-install 回落到源码），
  # 不走 *_binary_host 下载 → 不设这几项，让它们用各自默认值。

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      # ── 0) 解析版本号（手动触发用 inputs，tag 触发从 tag 名推 stable）──────────
      - name: 解析版本号
        id: v
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $s = '${{ inputs.stable }}'
            $b = '${{ inputs.beta }}'
            $d = '${{ inputs.dev }}'
            $w = '${{ inputs.w7 }}'
            $wb = '${{ inputs.w7beta }}'
            $wd = '${{ inputs.w7dev }}'
            $feed = '${{ inputs.deploy_feed }}'
          } else {
            # tag 触发：v10.1.4 → stable=10.1.4，其余通道沿用仓库里的默认值
            $tag = '${{ github.ref_name }}'
            $s = $tag -replace '^v', ''
            $b = '10.2.2'
            $d = '10.3.1'
            $w = '7.1.4'
            $wb = '7.2.1'
            $wd = '7.3.1'
            $feed = 'true'
          }
          "stable=$s" >> $env:GITHUB_OUTPUT
          "beta=$b" >> $env:GITHUB_OUTPUT
          "dev=$d" >> $env:GITHUB_OUTPUT
          "w7=$w" >> $env:GITHUB_OUTPUT
          "w7beta=$wb" >> $env:GITHUB_OUTPUT
          "w7dev=$wd" >> $env:GITHUB_OUTPUT
          "feed=$feed" >> $env:GITHUB_OUTPUT
          Write-Host "版本：stable=$s beta=$b dev=$d / w7=$w w7beta=$wb w7dev=$wd / feed=$feed"

      - uses: actions/checkout@v4

      # ── 1) 环境 ────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 检查 Python（打 w7 指纹补丁用）
        shell: pwsh
        run: python --version

      # ── 2) 依赖 ────────────────────────────────────────────────────────────
      - name: 安装依赖
        shell: pwsh
        run: npm ci --no-audit --no-fund

      # ── 3) 三棵 dsh 运行时树（被 gitignore，CI 必须自己拉）────────────────────
      #   0.1.7-rc.2  → stable 线（resources/dsh-runtime）
      #   0.2.0-rc.2  → beta 线（build/rt-next）
      #   0.2.1-alpha.1 → dev 线（build/rt-alpha）
      - name: 拉取 dsh 运行时树
        shell: pwsh
        run: |
          # 主线 stable 树：装到 resources/dsh-runtime
          node scripts/fetch-dsh.mjs --to resources/dsh-runtime --version 0.1.7-rc.2
          # beta / dev 树：beta=0.2.0-rc.2，dev=0.2.1-alpha.1
          node scripts/fetch-dsh.mjs --to build/rt-next  --version 0.2.0-rc.2
          node scripts/fetch-dsh.mjs --to build/rt-alpha --version 0.2.1-alpha.1
          # 升级差分源（老 stable 用户热更用）：0.1.5-rc.3
          node scripts/fetch-dsh.mjs --to build/rt-015 --version 0.1.5-rc.3

      - name: 校验运行时树
        shell: pwsh
        run: |
          foreach ($t in @('resources/dsh-runtime','build/rt-next','build/rt-alpha','build/rt-015')) {
            $f = Join-Path $t 'node_modules/@deepseek-ai/dsh/package.json'
            if (-not (Test-Path $f)) { throw "树缺失：$t" }
            $v = (Get-Content $f -Raw | ConvertFrom-Json).version
            Write-Host "  $t = $v"
          }

      # ── 4) 生成图标等资源（被 gitignore，构建期生成）──────────────────────────
      - name: 生成图标资源
        shell: pwsh
        run: npm run gen:assets

      # ── 4b) 打插件热更包（build/plugins-*.tar.gz + .meta.json）───────────────
      # 这一步以前**只在开发者本机手工跑**，CI 里完全没有 —— 后果是 feed 的
      # plugins 段永远是空的（release-v2.ps1 只读 build/plugins-*.meta.json，
      # 读不到就打 Info「插件 X 无 meta」然后静默跳过），于是「插件热更」这条
      # 通道在 CI 发版下形同虚设：插件改动到不了已装用户。
      #
      # auto 模式会按内容哈希自动升 patch 版本号并写回 package.json 的
      # dshDesktopBuild —— 所以这里改动了工作区文件，但发版产物是自洽的。
      - name: 打插件热更包
        shell: pwsh
        run: |
          node scripts/pack-all-plugins.mjs
          Write-Host ''
          Write-Host '插件包产物：'
          $metas = @(Get-ChildItem build/plugins-*.meta.json -ErrorAction SilentlyContinue)
          if ($metas.Count -eq 0) { throw '没有产出任何插件 meta，feed 的 plugins 段会是空的' }
          foreach ($m in $metas) {
            $j = Get-Content $m.FullName -Raw | ConvertFrom-Json
            Write-Host ("  {0}  ({1:N1} KB)" -f $j.version, ($j.size / 1KB))
          }

      # ── 4c) 外壳自身的回归测试 ───────────────────────────────────────────────
      # 这些 verify-*.mjs 读的是 out/ 产物，所以要先 build。
      # 以前 CI 一个都没跑，回归只能靠人记得在本机跑 —— 本仓库踩过的几个 bug
      # （恢复页白板、热更被拦、插件被降级）都是这类「静默失效」，正是它们该拦的。
      #
      # 刻意**不含** verify-hot-base：它读 dist/update/latest.json（本地发版产物、
      # 被 gitignore），CI 上根本没有那个文件，且它自初始版本起就依赖本机状态，
      # 不是可离线判定的回归。要纳入得先把它改成读固定 fixture。
      - name: 构建外壳并跑回归测试
        shell: pwsh
        run: |
          npm run build
          $scripts = @(
            'verify-safe-mode',
            'verify-view-layout',
            'verify-updater-picks'
          )
          $failed = @()
          foreach ($s in $scripts) {
            $f = "scripts/$s.mjs"
            if (-not (Test-Path $f)) { Write-Host "  . 跳过（不存在）：$f"; continue }
            Write-Host "`n--- $s ---"
            node $f
            if ($LASTEXITCODE -ne 0) { $failed += $s }
          }
          if ($failed.Count) { throw "回归测试失败：$($failed -join '、')" }

      # ── 5) 构建六个通道 ─────────────────────────────────────────────────────
      #   -SkipGen -SkipWrangler：feed 生成与部署在后面的步骤单独做
      #   （这样能先确认六个包都构建成功，再决定要不要发布）
      - name: 构建六通道安装包
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/release-v2.ps1 `
            -SkipGen -SkipWrangler -SkipNightly `
            -StableVersion '${{ steps.v.outputs.stable }}' `
            -BetaVersion   '${{ steps.v.outputs.beta }}' `
            -DevVersion    '${{ steps.v.outputs.dev }}' `
            -W7Version     '${{ steps.v.outputs.w7 }}' `
            -W7BetaVersion '${{ steps.v.outputs.w7beta }}' `
            -W7DevVersion  '${{ steps.v.outputs.w7dev }}'

      # ── 6) 产物自检 ─────────────────────────────────────────────────────────
      - name: 自检安装包
        shell: pwsh
        run: |
          $vs = @('${{ steps.v.outputs.stable }}','${{ steps.v.outputs.beta }}','${{ steps.v.outputs.dev }}',
                  '${{ steps.v.outputs.w7 }}','${{ steps.v.outputs.w7beta }}','${{ steps.v.outputs.w7dev }}')
          $missing = @()
          foreach ($v in $vs) {
            $f = "dist/DSH-Desktop-Setup-$v.exe"
            if (Test-Path $f) {
              Write-Host ("  ✓ {0}  {1:N1} MB" -f $f, ((Get-Item $f).Length/1MB))
            } else { $missing += $f; Write-Host "  ✗ $f 缺失" }
          }
          if ($missing.Count) { throw "有 $($missing.Count) 个安装包没构建出来" }

      # ── 7) 打热壳 + 运行时差分 + 生成六份 feed（挂外链）──────────────────────
      #   外链指向本仓库**本次的** Release（tag = 日期-序号）—— 但包还没上传，所以这里
      #   只生成 feed 骨架；等下面上传完 Release 后**再跑一次** gen 补哈希。
      # 每次发版用**自己的** release（tag = 日期-序号，如 2026.10.01-1）。
      # 以前所有版本都堆进同一个 `packages` tag，实测涨到 35 个资产、横跨十几版，
      # 想找某一版或清理旧版都很难。
      - name: 算本次的 release tag
        id: tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = (node scripts/release-tag.mjs).Trim()
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "本次 release tag = $tag"

      - name: 上传安装包到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $vs = @('${{ steps.v.outputs.stable }}','${{ steps.v.outputs.beta }}','${{ steps.v.outputs.dev }}',
                  '${{ steps.v.outputs.w7 }}','${{ steps.v.outputs.w7beta }}','${{ steps.v.outputs.w7dev }}')
          # 标题与 tag 同名（都是日期-序号），一眼能看出是哪一批
          $notes = "本次发版（六通道）：" + [Environment]::NewLine + (($vs | ForEach-Object { "- DSH-Desktop-Setup-$_.exe" }) -join [Environment]::NewLine)
          gh release create $tag --title $tag --notes $notes
          foreach ($v in $vs) {
            $f = "dist/DSH-Desktop-Setup-$v.exe"
            Write-Host "上传 $f ..."
            gh release upload $tag $f
          }

      - name: 生成六份 feed（含安装包哈希）
        shell: pwsh
        run: |
          # 外链指向**本次自己的** release（tag = 日期-序号）
          $base = 'https://gh-proxy.com/https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}'
          # -SkipWrangler：本步只生成 + 暂存，上传交给下一步（CI 上没有本机的 wrangler 目录）。
          # 缺的 latest-nightly.json 由 deploy-pages 从线上补齐，不会被整目录替换抹掉。
          powershell -ExecutionPolicy Bypass -File scripts/release-v2.ps1 `
            -SkipPack -SkipNightly -SkipWrangler `
            -StableVersion '${{ steps.v.outputs.stable }}' `
            -BetaVersion   '${{ steps.v.outputs.beta }}' `
            -DevVersion    '${{ steps.v.outputs.dev }}' `
            -W7Version     '${{ steps.v.outputs.w7 }}' `
            -W7BetaVersion '${{ steps.v.outputs.w7beta }}' `
            -W7DevVersion  '${{ steps.v.outputs.w7dev }}' `
            -SetupUrlStable "$base/DSH-Desktop-Setup-${{ steps.v.outputs.stable }}.exe" `
            -SetupUrlBeta   "$base/DSH-Desktop-Setup-${{ steps.v.outputs.beta }}.exe" `
            -SetupUrlDev    "$base/DSH-Desktop-Setup-${{ steps.v.outputs.dev }}.exe" `
            -SetupUrlW7     "$base/DSH-Desktop-Setup-${{ steps.v.outputs.w7 }}.exe" `
            -SetupUrlW7Beta "$base/DSH-Desktop-Setup-${{ steps.v.outputs.w7beta }}.exe" `
            -SetupUrlW7Dev  "$base/DSH-Desktop-Setup-${{ steps.v.outputs.w7dev }}.exe"

      # ── 7b) 校验 feed 真的挂上了热更包 / 插件（部署前最后一道闸）──────────────
      # 这一步是给「静默为空」兜底的。上面那几个通道缺失时 release-v2.ps1 只打
      # Info/Warn 不中断，于是 feed 少一块也照样部署 —— 实测踩过两次：
      #   · hot 块缺失 → 热更新永远不触发
      #   · plugins 段缺失 → 插件改动到不了已装用户
      # 这里把「应该有的块」变成硬断言，宁可发不出去也不要发一份残缺 feed。
      - name: 校验 feed 内容
        shell: pwsh
        run: |
          $stable = '${{ steps.v.outputs.stable }}'
          $beta   = '${{ steps.v.outputs.beta }}'
          $dev    = '${{ steps.v.outputs.dev }}'
          $problems = @()

          function Check-Feed([string]$file, [string]$channel, [string]$expectVersion) {
            if (-not (Test-Path $file)) { $script:problems += "$file 不存在"; return }
            $j = Get-Content $file -Raw | ConvertFrom-Json
            $tag = "[$channel] $file"
            if ($j.version -ne $expectVersion) { $script:problems += "$tag version=$($j.version)，期望 $expectVersion" }

            $hotCount = @($j.hot | Where-Object { $_ }).Count
            if ($hotCount -eq 0) { $script:problems += "$tag 没有 hot 块（热更新不可用）" }

            $pluginCount = @($j.plugins | Where-Object { $_ }).Count
            if ($pluginCount -eq 0) { $script:problems += "$tag 没有 plugins 段（插件热更不可用）" }

            # 外链模式下安装包必须带 sha256，否则客户端只能按 size 兜底
            if ($j.files) {
              foreach ($f in @($j.files)) {
                if ($f.url -and -not $f.sha256) { $script:problems += "$tag 安装包外链缺 sha256：$($f.url)" }
              }
            }
            Write-Host ("  {0}  version={1}  hot={2}  plugins={3}" -f $tag, $j.version, $hotCount, $pluginCount)
          }

          Write-Host '=== feed 内容校验 ==='
          Check-Feed 'dist/update/latest.json'      'stable' $stable
          Check-Feed 'dist/update/latest-beta.json' 'beta'   $beta
          Check-Feed 'dist/update/latest-dev.json'  'dev'    $dev

          if ($problems.Count) {
            Write-Host ''
            foreach ($p in $problems) { Write-Host "  ✗ $p" }
            throw "feed 校验失败（$($problems.Count) 项）—— 拒绝部署一份残缺的 feed"
          }
          Write-Host '  全部通过'

      # ── 8) 部署 feed（可选：缺 secrets 时跳过而不是失败）────────────────────
      - name: 部署 feed 到 Cloudflare Pages
        if: ${{ steps.v.outputs.feed == 'true' }}
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if (-not $env:CLOUDFLARE_API_TOKEN) {
            Write-Host '::warning::未配置 CLOUDFLARE_API_TOKEN，跳过 feed 部署'
            exit 0
          }
          # deploy-pages 默认会嵌套调 wrangler；这里直接让它跑完整流程
          # （需要 wrangler 可执行：用 npx 装一个临时的）
          npx --yes wrangler@4 pages deploy (Get-Content dist/update/.stage-dir -Raw).Trim() `
            --project-name dsh-desktop-feed --branch main --commit-dirty=true

      # ── 9) 收尾：把 feed 与热壳/差分也存一份到 Release（便于回溯）────────────
      - name: 归档构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-feed-${{ steps.v.outputs.stable }}
          path: |
            dist/update/latest*.json
            build/hot-shell-*.tar
            build/plugins-*.tar.gz
            build/plugins-*.meta.json
          retention-days: 30
          if-no-files-found: warn

      - name: 汇总
        if: always()
        shell: pwsh
        run: |
          Write-Host '=== 构建汇总 ==='
          Write-Host "  主线：stable=${{ steps.v.outputs.stable }} beta=${{ steps.v.outputs.beta }} dev=${{ steps.v.outputs.dev }}"
          Write-Host "  w7  ：stable=${{ steps.v.outputs.w7 }} beta=${{ steps.v.outputs.w7beta }} dev=${{ steps.v.outputs.w7dev }}"
          Write-Host "  feed 部署：${{ steps.v.outputs.feed }}"
          Write-Host ''
          Write-Host '  产物：'
          Get-ChildItem dist/DSH-Desktop-Setup-*.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.LastWriteTime -gt (Get-Date).AddHours(-2) } |
            ForEach-Object { Write-Host ("    {0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB)) }
